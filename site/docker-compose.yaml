name: Nap

services:
  site:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PLAUSIBLE_SRC_URL=${PLAUSIBLE_SRC_URL}
      - PLAUSIBLE_DATA_API=${PLAUSIBLE_DATA_API}
      - PLAUSIBLE_DATA_DOMAIN=${PLAUSIBLE_DATA_DOMAIN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
